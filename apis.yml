name: Illustra
description: 'Illustra Information Technologies was an object-relational database company founded in 1992
  by Michael Stonebraker, Gary Morgenthaler and several of Stonebraker''s students to commercialize the
  Postgres research project. Its DataBlade extensibility modules let structured and unstructured multimedia
  data (text, geospatial, web content) be stored and indexed as true objects. NASA selected it in 1995 to
  store millions of satellite images. Informix Corporation acquired the company in 1996 and folded the
  object-relational engine and DataBlades into what became Informix Universal Server; that lineage passed
  to IBM and is now maintained by HCL Technologies. Illustra no longer exists as an independent entity and
  publishes no standalone website, developer portal, or API. This record was surfaced from a historical
  Trinity Ventures portfolio list; enrichment found no live API surface.'
